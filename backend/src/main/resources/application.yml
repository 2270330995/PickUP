spring:
  application:
    name: pickup-backend
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

spring.flyway:
  enabled: true
  locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

pickup:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-long-random-base64-secret-at-least-32-bytes}
      access-token-ttl-ms: ${JWT_EXPIRATION_MS:3600000}
      refresh-token-ttl-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
      issuer: pickup-backend
  cors:
    allowed-origins: "*"
  dev:
    enabled: false
    auto-seed: false
    password: test
  google:
    routes:
      enabled: ${GOOGLE_ROUTES_ENABLED:false}
      api-key: ${GOOGLE_ROUTES_API_KEY:}
      base-url: https://routes.googleapis.com
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
    travel:
      assumed-speed-mps: 11.0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
