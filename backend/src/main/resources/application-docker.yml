pickup:
  dev:
    enabled: true
    auto-seed: true
    password: test

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pickup}
    username: ${POSTGRES_USER:pickup}
    password: ${POSTGRES_PASSWORD:pickup}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
